# azd manifest. `azd up` provisions from infra/ and deploys both services.
#
# TWO SERVICES, NOT ONE.
# The Bicep has always created two container apps, but only `web` was declared
# here. cortex-purview-mcp was therefore tagged azd-service-name: purview-mcp
# and then never deployed to — it ran the mcr quickstart placeholder forever,
# which is why a Foundry agent attached to the Purview MCP server got nothing
# back. The service below fixes that. Its key must stay `purview-mcp` because
# that is the tag the Bicep writes.
name: cortex
metadata:
  template: cortex-defra@1.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  purview-mcp:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile.mcp
      context: .

hooks:
  # Runs before provisioning, on every `azd up` and `azd provision`. This is
  # the guard that stops the two failures that have actually happened here:
  # a deprecated model version, and a re-provision rolling the running apps
  # back to the placeholder image. Deploy-Cortex.ps1 does the same checks in
  # more depth; this covers a bare `azd up`.
  preprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: ./scripts/Preprovision-Check.ps1
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: |
        echo "Skipping pre-provision checks — run scripts/Deploy-Cortex.ps1 from PowerShell 7 for the full set."

  postprovision:
    windows:
      shell: pwsh
      continueOnError: true
      interactive: false
      run: |
        Write-Host ""
        Write-Host "======================================================================"
        Write-Host " Cortex provisioned."
        Write-Host "======================================================================"
        Write-Host ""
        Write-Host " Web app: $env:CORTEX_WEB_URL"
        Write-Host " MCP    : $env:CORTEX_MCP_URL"
        Write-Host " Vault  : $env:KEYVAULT_NAME"
        Write-Host " Model  : $env:FOUNDRY_MODEL_DEPLOYMENT ($env:FOUNDRY_MODEL_NAME $env:FOUNDRY_MODEL_VERSION)"
        Write-Host ""
        Write-Host " THREE STEPS REMAIN. None can be automated."
        Write-Host ""
        Write-Host " 1. APIM subscription key -> Key Vault"
        Write-Host "      az keyvault secret set --vault-name $env:KEYVAULT_NAME ``"
        Write-Host "        --name apim-subscription-key --value '<key>'"
        Write-Host ""
        Write-Host " 2. Purview roles, in BOTH planes. Identity: $env:CORTEX_IDENTITY_PRINCIPAL_ID"
        Write-Host "      Unified Catalog > domain > Roles  : Data Product Owner + Governance Domain Reader"
        Write-Host "      Data Map > collection > Roles     : Data reader"
        Write-Host "      Missing the second is the most common cause of an empty marketplace."
        Write-Host ""
        Write-Host " 3. Entra sign-in, WITH the groups claim."
        Write-Host "      Without it everyone appears to be in no groups and sees almost nothing."
        Write-Host ""
        Write-Host " Then:  npm run bootstrap"
        Write-Host ""
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: |
        echo ""
        echo " Cortex provisioned. Web app: $CORTEX_WEB_URL"
        echo " Three manual steps remain — see docs/DEPLOY.md sections 4, 5 and 6."
        echo " Then: npm run bootstrap"
        echo ""
