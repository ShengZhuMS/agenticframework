# azd manifest. `azd up` provisions from infra/ and deploys both services.
name: cortex
metadata:
  template: cortex-defra-poc@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: ./scripts/postprovision.sh
