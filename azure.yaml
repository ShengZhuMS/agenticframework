# azd manifest. `azd up` provisions from infra/ and deploys both services.
#
# TWO SERVICES, NOT ONE.
# The Bicep has always created two container apps, but only `web` was declared
# here. cortex-purview-mcp was therefore tagged azd-service-name: purview-mcp
# and then never deployed to — it ran the mcr quickstart placeholder forever,
# which is why a Foundry agent attached to the Purview MCP server got nothing
# back. The service below fixes that. Its key must stay `purview-mcp` because
# that is the tag the Bicep writes.
name: cortex
metadata:
  template: cortex-defra@1.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  purview-mcp:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile.mcp
      context: .

hooks:
  # Runs before provisioning, on every `azd up` and `azd provision`. This is
  # the guard that stops the two failures that have actually happened here:
  # a deprecated model version, and a re-provision rolling the running apps
  # back to the placeholder image. Deploy-Cortex.ps1 does the same checks in
  # more depth; this covers a bare `azd up`.
  preprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      # Through a nested pwsh with -ExecutionPolicy Bypass, on purpose. A script
      # that arrived via OneDrive sync, a browser download or an extracted zip
      # carries the Mark of the Web, and the default RemoteSigned policy then
      # refuses it: "...is not digitally signed. You cannot run this script".
      # That failure cancels azd's concurrent docker builds too, which then
      # report a missing imgId file — two confusing errors for one cause.
      # Deploy-Cortex.ps1 also unblocks every script in the repository first.
      run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/Preprovision-Check.ps1; exit $LASTEXITCODE
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: |
        echo "Skipping pre-provision checks — run scripts/Deploy-Cortex.ps1 from PowerShell 7 for the full set."

  postprovision:
    windows:
      shell: pwsh
      continueOnError: true
      interactive: false
      run: |
        Write-Host ""
        Write-Host "======================================================================"
        Write-Host " Cortex provisioned."
        Write-Host "======================================================================"
        Write-Host ""
        Write-Host " Web app: $env:CORTEX_WEB_URL"
        Write-Host " MCP    : $env:CORTEX_MCP_URL"
        Write-Host " Config : $env:CORTEX_CONFIG_SOURCE"
        Write-Host " Model  : $env:FOUNDRY_MODEL_DEPLOYMENT ($env:FOUNDRY_MODEL_NAME $env:FOUNDRY_MODEL_VERSION)"
        Write-Host ""
        Write-Host " If you ran a bare 'azd up', three steps remain. Deploy-Cortex.ps1 does all of them:"
        Write-Host ""
        Write-Host " 1. APIM subscription key onto the app:   .\scripts\Deploy-Cortex.ps1 -SkipProvision -SkipBootstrap -SkipAuth -SkipHealthCheck"
        Write-Host " 2. Sign-in with the groups claim:        .\scripts\Set-CortexAuth.ps1"
        Write-Host " 3. Purview access for $env:CORTEX_IDENTITY_PRINCIPAL_ID and the content:"
        Write-Host "      . .\scripts\Set-CortexEnv.ps1"
        Write-Host "      npm run bootstrap"
        Write-Host ""
    posix:
      shell: sh
      continueOnError: true
      interactive: false
      run: |
        echo ""
        echo " Cortex provisioned. Web app: $CORTEX_WEB_URL"
        echo " Run scripts/Deploy-Cortex.ps1 from PowerShell 7 to finish: APIM key, sign-in, Purview access, content."
        echo ""
